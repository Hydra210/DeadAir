# Render Blueprint for DeadAir. Free Web Service: bot.py also serves /health so Render sees a port
# and an uptime pinger (UptimeRobot etc.) can keep it from spinning down.
services:
  - type: web
    name: deadair
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AUTO_JOIN
        value: "true"
      - key: DISCORD_TOKEN
        sync: false          # enter these in the dashboard, never commit them
      - key: ROBLOX_COOKIE
        sync: false
      - key: YOUTUBE_API_KEY   # optional, adds views/likes/search to /youtube
        sync: false
      - key: GITHUB_TOKEN      # optional, raises the /github rate limit
        sync: false
